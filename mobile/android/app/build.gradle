plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.teyago.services"
    compileSdk = 35

    compileOptions {
        // ✅ CRUCIAL : Core Library Desugaring activé (requis par flutter_local_notifications)
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    defaultConfig {
        applicationId = "com.teyago.services"
        // ✅ IMPORTANT : minSdk doit être au moins 21 pour desugaring
        minSdk = 21
        targetSdk = 35
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        
        multiDexEnabled true
    }

    buildTypes {
        release {
            // ✅ SOLUTION : Utiliser la signature debug pour tester
            signingConfig signingConfigs.debug
            
            // ✅ CORRECTION : Désactiver complètement toute optimisation
            minifyEnabled false
            shrinkResources false
            debuggable false
            
            // ✅ AJOUT : Configuration spécifique pour éviter l'erreur zip
            zipAlignEnabled false
            crunchPngs false
        }
        debug {
            minifyEnabled false
            shrinkResources false
            debuggable true
        }
    }
}

dependencies {
    // ✅ ESSENTIEL : Core Library Desugaring (requis par flutter_local_notifications)
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
    
    // MultiDex support
    implementation 'androidx.multidex:multidex:2.0.1'
    
    // Support Android de base
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    
    // ✅ AJOUT FIREBASE : BOM pour gérer les versions automatiquement
    implementation platform('com.google.firebase:firebase-bom:32.7.0')
    
    // ✅ FIREBASE : Services de base (sans firebase-core qui n'existe plus)
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-messaging'
}

// ✅ FIREBASE : Plugin Google Services OBLIGATOIREMENT en dernier
apply plugin: 'com.google.gms.google-services'